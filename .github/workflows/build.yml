name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 googletest

      - name: Build
        run: make

      - name: Test
        run: make test

      - uses: actions/upload-artifact@v4
        with:
          name: qstop
          path: bin/qstop
