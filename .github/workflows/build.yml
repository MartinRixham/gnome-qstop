name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 googletest

      - name: Build
        run: make

      - name: Test
        run: make test

      - uses: actions/upload-artifact@v4
        with:
          name: qstop
          path: bin/qstop

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: qstop
          path: bin

      - name: Check version matches tag
        run: |
          chmod +x bin/qstop
          version=$(bin/qstop --version | sed 's/\x1b\[[0-9;]*m//g; s/^qstop version: //')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match binary version $version"
            exit 1
          fi

      - name: Package
        run: |
          name=qstop-${GITHUB_REF_NAME}-linux-x86_64
          mkdir -p "$name/bin"
          install -m 755 bin/qstop "$name/bin/qstop"
          cp -r README.md LICENSE themes "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            qstop-${GITHUB_REF_NAME}-linux-x86_64.tar.gz*
